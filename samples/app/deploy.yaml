apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app: orders
    tier: backend
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: orders-api
          image: registry.internal/orders-api:0.2.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: db.internal
            - name: LOG_LEVEL
              value: Information
