name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LogsDigger.slnx

      - name: Build
        run: dotnet build LogsDigger.slnx --configuration Release --no-restore --nologo -v minimal -m:1

      # Includes the headless Avalonia scenario, which drives the real window and writes docs/screenshots.
      - name: Test
        run: dotnet test --project tests/LogsDigger.Tests/LogsDigger.Tests.fsproj --configuration Release --no-build

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Unit tests run on the JIT; the self-test runs the NativeAOT binary over paths that only fail there.
      - name: NativeAOT self-test
        run: |
          bash scripts/publish-logs-digger.sh --rid linux-x64 --output artifacts/publish/linux-x64
          artifacts/publish/linux-x64/LogsDigger --self-test
